<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ピノウォッチ</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172538;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:20px}h1{font-size:27px;margin:0 0 6px}.sub{color:#64748b;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}button,select,input{font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:white}button.active{background:#183b66;color:white}input{width:100%;margin-bottom:14px}.card{background:white;border-radius:14px;overflow:auto;box-shadow:0 4px 18px #1a38500c}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #e8edf2}th{font-size:12px;color:#64748b}td.num{text-align:right;font-variant-numeric:tabular-nums}.note{font-size:13px;color:#64748b;margin:14px 0}.error{color:#b91c1c}@media(max-width:600px){.wrap{padding:15px}h1{font-size:23px}button{padding:9px}}
</style></head><body><main class="wrap"><h1>🐾 ピノウォッチ</h1><div class="sub">日本株の高値・安値チェック</div><div class="controls"><button data-mode="low" class="active">年初来安値</button><button data-mode="high">年初来高値</button><button data-mode="all">上場来高値</button><select id="market"><option value="">全市場</option><option value="プライム">プライム</option><option value="スタンダード">スタンダード</option><option value="グロース">グロース</option></select></div><input id="search" placeholder="銘柄名・証券コードで検索"><div id="status" class="note">データを取得しています…</div><div class="card"><table><thead><tr><th>銘柄</th><th>市場</th><th>更新日</th><th style="text-align:right">終値</th><th style="text-align:right">年初来高値</th><th style="text-align:right">年初来安値</th><th style="text-align:right">配当利回り</th></tr></thead><tbody id="body"></tbody></table></div><p class="note">※ Yahoo Financeの非公式取得データを使用。更新遅延・欠損の可能性があります。上場来高値と配当利回りはデータ元未確保のため現在表示できません。投資判断には証券会社等の公式データをご確認ください。</p></main><script>
const DATA='https://raw.githubusercontent.com/pinonoir0504-collab/pinowatch-web/main/data/latest.json';let rows=[],mode='low',date='';const $=x=>document.getElementById(x);function render(){const m=$('market').value,q=$('search').value.trim().toLowerCase();const found=rows.filter(r=>(mode==='low'?r.lowUpdated:mode==='high'?r.highUpdated:false)&&(!m||r.market.includes(m))&&(!q||(r.name+r.code).toLowerCase().includes(q)));$('body').replaceChildren(...found.map(r=>{const tr=document.createElement('tr');[r.code+' '+r.name,r.market,r.date,r.close.toLocaleString('ja-JP')+'円',r.yearHigh.toLocaleString('ja-JP')+'円',r.yearLow.toLocaleString('ja-JP')+'円',r.dividendYield==null?'未取得':(r.dividendYield*100).toFixed(2)+'%'].forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i>2)td.className='num';tr.append(td)});return tr}));$('status').textContent=mode==='all'?'上場来高値は現在データ未対応です':date+' 時点・'+found.length+'銘柄（取得できた範囲）';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});$('market').onchange=render;$('search').oninput=render;fetch(DATA+'?t='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{rows=d.stocks||[];date=d.date;render()}).catch(e=>{$('status').className='note error';$('status').textContent='データ未生成または取得失敗：GitHub Actionsの初回実行を確認してください（'+e.message+'）'});
</script></body></html>
